<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Visualizador de WhatsApp</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='estilo.css') }}">
</head>
<body>
  <div class="app" id="app">
    <aside class="lateral">
      <header class="lateral-topo">
        <div>
          <h1>Conversas</h1>
          <span class="contador" id="contador"></span>
        </div>
        <a class="botao-topo" href="/estatisticas" target="_blank" rel="noopener" title="Estatísticas do backup inteiro (abre em nova aba)">📊 Estatísticas</a>
      </header>
      <div class="busca">
        <input id="busca" type="search" placeholder="Pesquisar conversa ou mensagem" autocomplete="off">
      </div>
      <ul class="lista" id="lista"></ul>
    </aside>

    <main class="painel">
      <div class="vazio" id="vazio">
        <h2>Visualizador de WhatsApp</h2>
        <p>Selecione uma conversa à esquerda.</p>
      </div>
      <section class="chat" id="chat" hidden>
        <header class="chat-topo">
          <button class="voltar" id="voltar" aria-label="Voltar">←</button>
          <button class="chat-titulo" id="chat-titulo" title="Dados da conversa: fotos, áudios, links e participantes">
            <span class="avatar" id="chat-avatar"></span>
            <span class="chat-textos">
              <span class="chat-nome" id="chat-nome"></span>
              <span class="chat-info" id="chat-info"></span>
            </span>
          </button>
          <button class="icone" id="abrir-busca" title="Buscar nesta conversa" aria-label="Buscar nesta conversa">🔍</button>
          <a class="exportar" id="exportar" target="_blank" rel="noopener" title="Exportar conversa em PDF">PDF</a>
        </header>
        <div class="barra-busca" id="barra-busca" hidden>
          <input id="busca-chat" type="search" placeholder="Buscar nesta conversa" autocomplete="off">
          <span class="busca-contador" id="busca-contador"></span>
          <button class="icone" id="busca-anterior" title="Anterior (Enter)" aria-label="Resultado anterior">▲</button>
          <button class="icone" id="busca-proxima" title="Próxima (Shift+Enter)" aria-label="Próximo resultado">▼</button>
          <button class="icone" id="fechar-busca" title="Fechar (Esc)" aria-label="Fechar busca">✕</button>
        </div>
        <div class="mensagens" id="mensagens"></div>
      </section>

      <aside class="dados" id="dados" hidden>
        <header class="dados-topo">
          <button class="icone" id="fechar-dados" aria-label="Fechar">✕</button>
          <span>Dados da conversa</span>
        </header>
        <div class="dados-corpo" id="dados-corpo"></div>
      </aside>
    </main>
  </div>

  <div class="ampliacao" id="ampliacao" hidden>
    <div class="ampliacao-midia" id="ampliacao-midia"></div>
    <aside class="metadados" id="metadados" aria-label="Metadados do arquivo"></aside>
    <button class="icone fechar-ampliacao" id="fechar-ampliacao" title="Fechar (Esc)" aria-label="Fechar">✕</button>
  </div>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
